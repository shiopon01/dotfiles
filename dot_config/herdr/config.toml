# herdr configuration
# 全オプションの一覧は `herdr --default-config` で確認できる。
# 変更後は `herdr server reload-config` または prefix+shift+r で再読み込み。

[theme]
# 端末は Ghostty(設定ファイルなしの既定状態)。特に合わせる対象がないので
# 見やすさで kanagawa を選んでいる。変えたい場合の候補は
# catppuccin / tokyo-night / dracula / nord / gruvbox / one-dark /
# solarized / rose-pine / vesper。
name = "kanagawa"

[ui]
# ウィンドウタイトル(Ghostty のタブ/ウィンドウに出る)
window_title = "{hostname}: {workspace}"

# tmux の new-window は名前を聞かないので、それに合わせて即座に作る
prompt_new_tab_name = false

[keys]
# tmux と同じ C-q に揃える。
# 注: herdr のペイン内で tmux を起動すると prefix が衝突する(herdr 側が先に
#     捕まえるため、内側の tmux には C-q が届かない)。
prefix = "ctrl+q"

##
# tmux.conf の `bind -n C-M-*`(prefix 不要の直接バインド)を移植したもの。
# tmux の window = herdr の tab に対応する。
##

# ウィンドウ操作 → タブ
new_tab      = "ctrl+alt+c"   # tmux: C-M-c new-window
close_tab    = "ctrl+alt+k"   # tmux: C-M-k kill-window
next_tab     = "ctrl+alt+n"   # tmux: C-M-n next-window
previous_tab = "ctrl+alt+p"   # tmux: C-M-p previous-window

##
# ここから下は tmux に対応物がない herdr 固有の操作。
# 1つのアクションには配列で複数キーを割り当てられるので、herdr の既定キーも
# 第2キーとして残してある。
##

# space(workspace)操作
new_workspace      = ["prefix+c", "prefix+shift+n"]        # 新規作成
close_workspace    = ["prefix+x", "prefix+shift+d"]        # 削除(confirm_close で確認あり)
rename_workspace   = ["prefix+r", "prefix+shift+w"]        # 名前変更
previous_workspace = "prefix+p"                            # 前の space
next_workspace     = "prefix+n"                            # 次の space
switch_workspace   = "prefix+shift+1..9"                   # 番号で直接切り替え

# rename_workspace に prefix+r を譲った玉突きの調整。
# resize_mode の既定は prefix+r、reload_config の既定は prefix+shift+r だった。
# reload_config は `herdr server reload-config` でも実行できるのでキーを外す。
resize_mode   = "prefix+shift+r"
reload_config = ""

# agent 切り替え
previous_agent = "prefix+["
next_agent     = "prefix+]"
focus_agent    = "prefix+alt+1..9"

# ペイン操作
# 注1: herdr の vertical/horizontal がどちらの分割方向を指すかはドキュメント上
#      明示されていない。逆に感じたら下2行のキーを入れ替えること。
# 注2: tmux では ] と \ だったが、対になっていて押しやすい [ ] にずらした。
#      ctrl+[ は端末のレガシーエンコーディングでは ESC と同じバイトになるため、
#      Kitty keyboard protocol が効いていない端末では ESC と区別できない。
#      Ghostty は同プロトコルに対応しているので動く想定。効かなければ ] \ に戻す。
split_vertical   = "ctrl+alt+["          # tmux: C-M-] split-window -h (左右に分割)
split_horizontal = "ctrl+alt+]"          # tmux: C-M-\ split-window -v (上下に分割)
close_pane       = "ctrl+alt+x"          # tmux: C-M-x kill-pane
cycle_pane_next  = "ctrl+alt+o"          # tmux: C-M-o select-pane -t :.+

# prefix+alt+g で lazygit をポップアップ表示
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

# 背景の space で agent が完了/ブロックしたときの通知。
# 既定は "off" で何も出ない。"system" で macOS の通知センターに出す。
# ("terminal" = Ghostty 経由, "herdr" = アプリ内トースト)
# 通知元へは prefix+o (open_notification_target) でジャンプできる。
[ui.toast]
delivery = "system"

[experimental]
# 日本語入力中(IME on)でも prefix キーが効くように、prefix モードの間だけ
# ASCII 入力ソースへ一時的に切り替える
switch_ascii_input_source_in_prefix = true

# TUI が自前でカーソルを描くアプリ(Claude Code / codex 等)で、IME の変換候補
# ウィンドウがカーソルを追従するようにする
# トレードオフ: カーソルを隠すだけのアプリ(vim のノーマルモード等)では
# カーソルが二重に見えるため、下の allow-list で対象を絞っている
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex"]
